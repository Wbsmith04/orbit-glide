<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3366"/>
      <stop offset="1" stop-color="#10132a"/>
    </linearGradient>
    <clipPath id="planet"><circle cx="452" cy="590" r="215"/></clipPath>
    <clipPath id="bgp"><circle cx="880" cy="900" r="210"/></clipPath>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd3ff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#8fd3ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8fd3ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1d6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff1d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- distant planet -->
  <g clip-path="url(#bgp)"><circle cx="880" cy="900" r="210" fill="#1d2248"/><circle cx="850" cy="870" r="212" fill="#262d5c"/></g>
  <!-- dust -->
  <g fill="#f6ecd9">
    <circle cx="150" cy="170" r="7" opacity="0.7"/><circle cx="300" cy="90" r="4" opacity="0.5"/>
    <circle cx="890" cy="420" r="5" opacity="0.6"/><circle cx="110" cy="880" r="5" opacity="0.5"/>
    <circle cx="600" cy="960" r="4" opacity="0.4"/>
    <path d="M700 90 l10 30 30 10 -30 10 -10 30 -10 -30 -30 -10 30 -10z" opacity="0.85"/>
    <path d="M140 400 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6z" opacity="0.6"/>
  </g>
  <!-- halo + planet -->
  <circle cx="452" cy="590" r="380" fill="url(#halo)"/>
  <!-- back of orbit -->
  <path d="M168 676 A 300 108 -20 0 1 744 466" fill="none" stroke="#ff6b4a" stroke-width="22" stroke-linecap="round" stroke-dasharray="0.1 52" opacity="0.75"/>
  <g clip-path="url(#planet)">
    <circle cx="452" cy="590" r="215" fill="#d8c4a0"/>
    <circle cx="392" cy="530" r="215" fill="#f6ecd9"/>
    <circle cx="360" cy="660" r="26" fill="#e6d6b8"/><circle cx="470" cy="480" r="16" fill="#e6d6b8"/>
  </g>
  <path d="M300 528 A 160 160 0 0 1 380 420" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.55"/>
  <!-- front of orbit -->
  <path d="M744 466 A 300 108 -20 0 1 168 676" fill="none" stroke="#ff6b4a" stroke-width="22" stroke-linecap="round" stroke-dasharray="0.1 52" stroke-dashoffset="-26"/>
  <!-- comet flinging off -->
  <path d="M600 330 L 820 205" stroke="url(#trail)" stroke-width="64" stroke-linecap="round" fill="none"/>
  <circle cx="826" cy="202" r="52" fill="#fff8ec"/>
  <circle cx="842" cy="216" r="30" fill="#8fd3ff" opacity="0.4"/>
</svg>
